[user]
name = "Igor Serebryany"
email = "igor47@moomers.org"

[signing]
# "drop", not "own": with sign-on-push below, jj signs only at push time. "own" signs on
# every write, including the working-copy snapshot any command makes, so with a signer that
# needs an unlocked machine (Secretive, YubiKey) every jj command fails while locked.
behavior = "drop"
backend = "gpg"
key = "D0A37C06E95A2D72C2965B96139A885FFDB309E3"

[git]
sign-on-push = true

[ui]
default-command = "status"
diff-editor = ["nvim", "-c", "DiffEditor $left $right $output"]

[templates]
git_push_bookmark = '"igor/" ++ change_id.short()'

[fsmonitor]
backend = "watchman"

[remotes.origin]
auto-track-bookmarks = "glob:*"

[revset-aliases]
# trunk and other people's remote bookmarks are immutable; my own igor/* pushes stay rewritable.
"immutable_heads()" = 'builtin_immutable_heads() | (remote_bookmarks() ~ remote_bookmarks(glob:"igor/*"))'
